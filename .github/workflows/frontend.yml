name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

  build:
    name: Build and Push Frontend Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            codeykenny/frontend-repo:latest
            codeykenny/frontend-repo:${{ github.sha }}
            codeykenny/frontend-repo:${{ github.run_number }}
  deploy:
    name: Deploy Frontend
    needs: build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull latest frontend image
        run: docker compose pull

      - name: Deploy with Docker Compose
        run: docker compose up -d

      - name: Verify deployment
        run: |
          docker compose ps

          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl -fs http://localhost:3000; then
              echo
              echo "Frontend is ready!"
              break
            fi

            echo "Frontend not ready yet. Waiting 2 seconds..."
            sleep 2
          done

          echo "Final frontend check:"
          curl -f http://localhost:3000